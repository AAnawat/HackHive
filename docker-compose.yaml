services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: hackhive-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hackhive-network
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: hackhive-backend
    ports:
      - "8080:8080"
    volumes:
      - /app/node_modules
      - ./backend:/app
      # Lets the backend launch problem containers when CLOUD_PROVIDER=local
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./backend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
      - CLOUD_PROVIDER=${CLOUD_PROVIDER:-local}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    depends_on:
      - database
      - problem
    networks:
      - hackhive-network
  database:
    image: postgres
    container_name: hackhive-postgres
    ports:
      - "5432:5432"
    volumes:
      - hackhive-ps:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - hackhive-network
  problem:
    build:
      context: ./problems/
      dockerfile: dockerfile
    # Local problem image for task_definition "getting-start:1"
    image: hackhive-problem-getting-start
    container_name: hackhive-problem
    ports:
      - "1234:1234"
    networks:
      - hackhive-network
  scheduler:
    build:
      context: ./scheduler/
      dockerfile: dockerfile
    container_name: hackhive-scheduler
    env_file:
      - path: ./scheduler/.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=development
      - CLOUD_PROVIDER=${CLOUD_PROVIDER:-local}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    depends_on:
      - database
    networks:
      - hackhive-network

networks:
  hackhive-network:

volumes:
  hackhive-ps:
